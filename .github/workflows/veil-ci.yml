name: veil-pii-redactor-agent
version: 1.0.0
description: CI for the VEIL PII redaction agent - engine tests, cross-engine parity, browser smoke, README integrity and the fixture guard.

on:
  push:
    branches: [main]
    paths:
      - "pii-redactor-agent/**"
  pull_request:
    paths:
      - "pii-redactor-agent/**"
  workflow_dispatch:

jobs:
  verify:
    name: Engine, parity and docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pii-redactor-agent
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi httpx

      - name: Fixture guard - no unmarked credential-shaped fixture
        run: python3 tools/fixture_guard.py

      - name: Engine test suite
        run: python3 -m pytest -q

      - name: Cross-engine parity - Python vs browser JS
        run: python3 tools/parity_check.py

      - name: Browser engine smoke test
        run: node tools/web_smoke.js

      - name: Generated demo data is up to date
        run: python3 tools/build_web_data.py --check

      - name: README integrity - every documented path and command
        run: python3 tools/readme_check.py
