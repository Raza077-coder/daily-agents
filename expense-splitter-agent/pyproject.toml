[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splitkit"
version = "1.0.0"
description = "Deterministic shared-expense splitter with minimum-transfer settle-up"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Raza077-coder" }]
keywords = ["expenses", "splitting", "ledger", "settlement", "money", "offline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6"]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
splitkit = "splitkit.cli:main"

[tool.setuptools.packages.find]
include = ["splitkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
