[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "habitos-agent"
version = "1.0.0"
description = "HABITOS — Habit Tracker Agent. Daily habit logging, streaks, weekly reports. Deterministic & offline."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Daily Agent Builder"}]
keywords = ["habits", "streaks", "tracker", "agent", "productivity"]

[project.scripts]
habitos = "habit_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["habit_tracker*"]
