[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veil-pii"
description = "Deterministic PII redaction: find and remove personal and secret data with rules you can audit."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Daily Agents" }]
keywords = ["pii", "redaction", "privacy", "gdpr", "security", "anonymization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Text Processing",
]
# The engine depends on nothing but the standard library. FastAPI is an optional
# extra for the HTTP surface, which keeps `pip install veil-pii` a zero-risk
# operation in a locked-down environment.
dependencies = []
version = "1.0.0"

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.27"]

[project.scripts]
veil = "veil.cli:main"

[tool.setuptools]
packages = ["veil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
