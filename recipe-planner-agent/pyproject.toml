[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pantry-agent"
version = "1.0.0"
description = "PANTRY \u2014 deterministic, offline recipe finder, meal planner and shopping-list builder."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Daily Agent Builder" }]
keywords = ["recipes", "meal-planning", "pantry", "shopping-list", "offline", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Home Automation",
  "Topic :: Other/Nonlisted Topic",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "pydantic>=2.5", "uvicorn>=0.27"]
dev = ["pytest>=7.4", "fastapi>=0.110", "pydantic>=2.5", "httpx>=0.27"]

[project.scripts]
pantry = "pantry.cli:main"

[project.urls]
Homepage = "https://github.com/Raza077-coder/daily-agents"

[tool.setuptools]
packages = ["pantry"]

[tool.setuptools.package-data]
pantry = ["data/*.json", "data/*.txt", "persona.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
