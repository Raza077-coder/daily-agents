[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-workout-coach"
version = "1.0.0"
description = "FORGE — deterministic strength & workout coach: programming, logging, PRs and volume analytics. Offline, no accounts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Daily Agent Builder" }]
keywords = ["fitness", "strength", "workout", "training", "coach", "progressive-overload"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Other/Nonlisted Topic",
]

dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0"]
dev = ["pytest>=7.0", "httpx>=0.27"]
all = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0", "pytest>=7.0", "httpx>=0.27"]

[project.scripts]
forge = "forge.cli:main"

[project.urls]
Homepage = "https://github.com/Raza077-coder/daily-agents/tree/main/workout-coach-agent"

[tool.setuptools]
packages = ["forge"]
include-package-data = true

[tool.setuptools.package-data]
forge = ["../forge_persona.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
